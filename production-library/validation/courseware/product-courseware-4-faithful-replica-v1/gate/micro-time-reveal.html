<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>门禁微镜头 · TIME 榜单揭示 t=2.0–9.0s · CW4 保真复刻</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    :root {
      --canvas-w: 1920px;
      --canvas-h: 1080px;
      --time-x: 211.3px; --time-y: 261px; --time-w: 388.9px; --time-h: 558px;
      --card-x: 768.9px; --card-y: 276.8px; --card-w: 978px; --card-h: 519.8px;
      --silk: #ccc9c2;
      --card-bg: #4f4f4f;
      --lime: #c6e000;
      --yellow: #e9f200;
      --time-red: #b11a1a;
      --dur: 7s; /* maps ref 2.0→9.0 */
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1a1a;
      color: #eee;
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 12px;
    }
    .meta {
      width: min(960px, 100%);
      font-size: 13px;
      line-height: 1.5;
    }
    .meta code { background: #333; padding: 1px 6px; border-radius: 4px; }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      width: min(960px, 100%);
    }
    button {
      background: #2d6cdf;
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary { background: #444; }
    .clock {
      font-family: ui-monospace, monospace;
      font-size: 14px;
      opacity: 0.9;
    }
    .stage-wrap {
      width: min(960px, 100%);
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,.45);
    }
    .canvas {
      width: var(--canvas-w);
      height: var(--canvas-h);
      position: relative;
      transform-origin: 0 0;
      background-color: var(--silk);
      background-image:
        url("silk-patch.jpg"),
        linear-gradient(125deg, #d4d1ca 0%, #c5c2ba 40%, #d8d5ce 70%, #bdbab2 100%);
      background-size: 280px 140px, cover;
      background-blend-mode: soft-light, normal;
      overflow: hidden;
    }
    .time-cover {
      position: absolute;
      left: var(--time-x);
      top: var(--time-y);
      width: var(--time-w);
      height: var(--time-h);
      background: #fff;
      border: 10px solid var(--time-red);
      box-shadow: 0 10px 28px rgba(0,0,0,.18);
      display: flex;
      flex-direction: column;
      padding: 28px 22px 18px;
      opacity: 0;
      transform: translateY(12px);
    }
    .time-cover .masthead {
      font-family: var(--font-latin-serif);
      font-weight: 700;
      font-size: 92px;
      line-height: 0.9;
      color: var(--time-red);
      letter-spacing: -2px;
      text-align: center;
    }
    .time-cover .big {
      margin-top: 36px;
      font-family: var(--font-latin-serif);
      font-weight: 700;
      font-size: 58px;
      line-height: 1.05;
      color: var(--time-red);
    }
    .time-cover .med {
      margin-top: 18px;
      font-family: var(--font-latin-serif);
      font-size: 28px;
      color: #1a1a1a;
      font-weight: 600;
    }
    .time-cover .barcode {
      margin-top: auto;
      width: 120px;
      height: 36px;
      background: repeating-linear-gradient(
        90deg,
        #111 0 2px,
        #fff 2px 4px,
        #111 4px 5px,
        #fff 5px 8px
      );
      opacity: 0.85;
    }
    .info-card {
      position: absolute;
      left: var(--card-x);
      top: var(--card-y);
      width: var(--card-w);
      height: var(--card-h);
      background: var(--card-bg);
      border-radius: 48px;
      box-shadow: 0 12px 30px rgba(0,0,0,.2);
      padding: 52px 56px 48px 64px;
      color: #fff;
      opacity: 0;
      transform: translateX(24px);
    }
    .card-head {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .chevron-icon {
      flex: 0 0 auto;
      width: 88px;
      height: 88px;
      margin-top: 0;
      opacity: 0;
      filter: drop-shadow(0 2px 1px rgba(0,0,0,.2));
    }
    .chevron-icon path {
      fill: var(--lime);
    }
    .card-title {
      font-family: var(--font-display);
      color: var(--yellow);
      font-size: 46px;
      font-weight: 400;
      line-height: 1.3;
      letter-spacing: 0.5px;
      min-height: 1.3em;
    }
    .card-title .ch {
      opacity: 0;
    }
    .card-underline {
      margin-top: 14px;
      height: 3px;
      background: var(--yellow);
      width: 0%;
      opacity: 0.95;
      border-radius: 1px;
    }
    .card-list {
      font-family: var(--font-display);
      margin-top: 36px;
      padding-left: 4px;
      list-style: none;
      font-size: 64px;
      font-weight: 500;
      line-height: 1.68;
      color: #f2f2f2;
      letter-spacing: 0.14em;
    }
    .card-list li {
      opacity: 0;
      transform: translateY(10px);
      margin: 4px 0;
      padding-left: 0.05em;
    }
    .subtitle {
      position: absolute;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      font-family: var(--font-display);
      font-size: 50px;
      font-weight: 500;
      color: #1a1a1a;
      letter-spacing: 0.06em;
      text-shadow:
        0 0 4px #fff,
        0 0 8px #fff,
        1px 1px 0 #fff,
        -1px -1px 0 #fff,
        2px 0 0 #fff,
        -2px 0 0 #fff,
        0 2px 0 #fff,
        0 -2px 0 #fff,
        3px 0 0 #fff,
        -3px 0 0 #fff,
        0 3px 0 #fff,
        0 -3px 0 #fff;
      white-space: nowrap;
      z-index: 40;
      opacity: 0;
    }
    .badge {
      position: absolute;
      right: 16px;
      top: 16px;
      background: rgba(0,0,0,.55);
      color: #9cf;
      font-size: 18px;
      padding: 6px 12px;
      border-radius: 6px;
      z-index: 50;
      font-family: ui-monospace, monospace;
    }
    /* playing states driven by .play on canvas */
    .canvas.play .time-cover {
      animation: fadeInUp 0.45s ease-out forwards;
      animation-delay: 0.05s;
    }
    .canvas.play .info-card {
      animation: fadeInRight 0.45s ease-out forwards;
      animation-delay: 0.12s;
    }
    .canvas.play .chevron-icon {
      animation: fadeIn 0.25s ease-out forwards;
      animation-delay: 0.35s;
    }
    .canvas.play .card-underline {
      animation: growLine 0.35s ease-out forwards;
      animation-delay: 2.4s;
    }
    .canvas.play .card-list li:nth-child(1) {
      animation: listIn 0.35s ease-out forwards;
      animation-delay: 2.55s;
    }
    .canvas.play .card-list li:nth-child(2) {
      animation: listIn 0.35s ease-out forwards;
      animation-delay: 2.75s;
    }
    .canvas.play .card-list li:nth-child(3) {
      animation: listIn 0.35s ease-out forwards;
      animation-delay: 2.95s;
    }
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeInRight {
      to { opacity: 1; transform: translateX(0); }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes growLine {
      to { width: 100%; }
    }
    @keyframes listIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .canvas.play .card-title .ch {
      animation: chIn 0.04s linear forwards;
    }
    body.embed {
      padding: 0;
      background: #000;
      min-height: 0;
      height: 100vh;
    }
    body.embed .meta,
    body.embed .controls { display: none; }
    body.embed .stage-wrap {
      width: 100vw;
      height: 100vh;
      border-radius: 0;
      box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="meta">
    <strong>门禁微镜头</strong> · 屏幕 <code>S01_time_list</code> · 参考区间 <code>t=2.0–9.0s</code>（本动画本地 0–7s 映射）<br />
    动作：TIME+深灰卡入场 → 标题逐字 → 下划线 → 列表 1/2/3 → 字幕切换。<br />
    版本 <code>product-courseware-4-faithful-replica-v1</code>
  </div>
  <div class="controls">
    <button id="btnPlay" type="button">重播微镜头</button>
    <button id="btnPause" class="secondary" type="button">停在终态</button>
    <span class="clock" id="clock">local 0.00s · ref ~2.00s</span>
  </div>
  <div class="stage-wrap" id="stage">
    <div class="canvas" id="canvas">
      <div class="badge" id="badge">MICRO · ref t=2.0s</div>
      <div class="time-cover">
        <div class="masthead">TIME</div>
        <div class="big">Big<br />Title</div>
        <div class="med">Medium Black Title</div>
        <div class="barcode" aria-hidden="true"></div>
      </div>
      <div class="info-card">
        <div class="card-head">
          <svg class="chevron-icon" viewBox="0 0 72 72" aria-hidden="true">
            <path d="M10 12 L34 36 L10 60 L18 60 L42 36 L18 12 Z"/>
            <path d="M32 12 L56 36 L32 60 L40 60 L64 36 L40 12 Z"/>
          </svg>
          <div class="card-title-block">
            <div class="card-title" id="title"></div>
            <div class="card-underline"></div>
          </div>
        </div>
        <ul class="card-list">
          <li>1.番茄</li>
          <li>2.***</li>
          <li>3.***</li>
        </ul>
      </div>
      <div class="subtitle" id="sub"></div>
    </div>
  </div>
  <script>
    const TITLE = "对人类健康贡献最大的10种健康食品";
    const titleEl = document.getElementById("title");
    TITLE.split("").forEach((ch, i) => {
      const s = document.createElement("span");
      s.className = "ch";
      s.textContent = ch;
      s.style.animationDelay = `${0.45 + i * 0.09}s`;
      titleEl.appendChild(s);
    });

    const sub = document.getElementById("sub");
    const badge = document.getElementById("badge");
    const clock = document.getElementById("clock");
    const canvas = document.getElementById("canvas");
    let raf = 0;
    let t0 = 0;
    let running = false;

    const SUBS = [
      { t: 0.8, text: "美国《时代杂志评选》的" },
      { t: 2.8, text: "“对人类健康贡献最大的10种健康食品”" },
      { t: 5.8, text: "其中番茄位列第一" },
    ];

    if (new URLSearchParams(location.search).has("embed") || window.self !== window.top) {
      document.body.classList.add("embed");
    }
    function fit() {
      const stage = document.getElementById("stage");
      const s = Math.min(stage.clientWidth / 1920, stage.clientHeight / 1080 || stage.clientWidth / 1920);
      canvas.style.transform = `scale(${s})`;
      if (!document.body.classList.contains("embed")) {
        stage.style.height = `${1080 * s}px`;
      }
    }
    fit();
    window.addEventListener("resize", fit);

    function setSub(localT) {
      let text = "";
      for (const s of SUBS) if (localT >= s.t) text = s.text;
      if (text) {
        sub.textContent = text;
        sub.style.opacity = "1";
      } else {
        sub.style.opacity = "0";
      }
    }

    function tick(now) {
      if (!running) return;
      const local = (now - t0) / 1000;
      const ref = 2 + local;
      clock.textContent = `local ${local.toFixed(2)}s · ref ~${ref.toFixed(2)}s`;
      badge.textContent = `MICRO · ref t≈${Math.min(ref, 9).toFixed(1)}s`;
      setSub(local);
      if (local < 7.05) {
        raf = requestAnimationFrame(tick);
      } else {
        running = false;
        // hold end state
        canvas.classList.add("play");
        Array.from(titleEl.querySelectorAll(".ch")).forEach((el) => {
          el.style.opacity = "1";
          el.style.animation = "none";
        });
        document.querySelectorAll(".card-list li, .chevron-icon, .time-cover, .info-card").forEach((el) => {
          el.style.opacity = "1";
          el.style.transform = "none";
          el.style.animation = "none";
        });
        document.querySelector(".card-underline").style.width = "100%";
        setSub(7);
      }
    }

    function replay() {
      cancelAnimationFrame(raf);
      running = false;
      // reset inline overrides
      canvas.classList.remove("play");
      void canvas.offsetWidth;
      [
        ".time-cover",
        ".info-card",
        ".chevron-icon",
        ".card-underline",
        ".card-list li",
        ".card-title .ch",
      ].forEach((sel) => {
        document.querySelectorAll(sel).forEach((el) => {
          el.style.opacity = "";
          el.style.transform = "";
          el.style.animation = "";
          el.style.width = "";
        });
      });
      sub.style.opacity = "0";
      sub.textContent = "";
      // re-bind char delays
      titleEl.querySelectorAll(".ch").forEach((el, i) => {
        el.style.animationDelay = `${0.45 + i * 0.09}s`;
      });
      canvas.classList.add("play");
      t0 = performance.now();
      running = true;
      raf = requestAnimationFrame(tick);
    }

    function holdEnd() {
      cancelAnimationFrame(raf);
      running = false;
      canvas.classList.add("play");
      Array.from(titleEl.querySelectorAll(".ch")).forEach((el) => {
        el.style.opacity = "1";
        el.style.animation = "none";
      });
      document.querySelectorAll(".card-list li, .chevron-icon, .time-cover, .info-card").forEach((el) => {
        el.style.opacity = "1";
        el.style.transform = "none";
        el.style.animation = "none";
      });
      document.querySelector(".card-underline").style.width = "100%";
      setSub(7);
      clock.textContent = "local 7.00s · ref ~9.00s (held)";
      badge.textContent = "MICRO · ref t≈9.0s (held)";
    }

    document.getElementById("btnPlay").addEventListener("click", replay);
    document.getElementById("btnPause").addEventListener("click", holdEnd);
    // autoplay once
    replay();
  </script>
</body>
</html>
